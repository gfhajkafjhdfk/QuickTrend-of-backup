name: 💡 Feature request
description: Suggest an idea or improvement for QuickTrend
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tell us the problem you want to solve — not only the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: "What are you trying to do that is hard today?"
      placeholder: "As a user, I want ... so that ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How might it work? Rough sketches or examples welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for a similar idea
          required: true
