name: 🐛 Bug report
description: Report something that is broken or not working as expected
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below so we can reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click a spot on the map, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Map / Mapbox
        - Chat / rooms
        - Auth (login / signup)
        - Matching
        - Other
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device (and PHP/MySQL version if it is a local setup issue)
      placeholder: Chrome 120, macOS 14, iPhone 15
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This report contains no secrets (tokens, passwords)
          required: true
